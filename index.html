<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuvana — Premium Dry Fruits & Nuts</title>
  <meta name="description" content="Nuvana storefront and admin — a design prototype." />

  <!-- Fonts (fall back gracefully to system fonts if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23143026'/%3E%3Cpath d='M50 24c14 6 20 18 14 34-4 10-14 16-14 16s-10-6-14-16c-6-16 0-28 14-34z' fill='%23E29A2C'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="root">
    <!-- Fallback shown until React mounts (or if offline) -->
    <div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="text-align:center;max-width:420px;font-family:'Manrope',system-ui,sans-serif;color:#6E6557;">
        <div style="width:52px;height:52px;border-radius:15px;margin:0 auto 18px;background:linear-gradient(160deg,#235240,#143026);"></div>
        <div style="font-family:'Fraunces',Georgia,serif;font-size:22px;color:#143026;font-weight:600;">Nuvana</div>
        <p style="margin-top:10px;font-size:14px;line-height:1.5;">Preparing your store…</p>
        <p id="boot-note" style="margin-top:14px;font-size:12.5px;color:#968B79;display:none;">
          This prototype loads React from a CDN on first open, so it needs an internet connection.
          If it stays on this screen, check your connection and refresh.
        </p>
      </div>
    </div>
  </div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;">Please enable JavaScript to view this prototype.</div>
  </noscript>

  <!-- Show the connectivity hint if things take too long -->
  <script>
    setTimeout(function () {
      var n = document.getElementById('boot-note');
      if (n && document.getElementById('boot')) n.style.display = 'block';
    }, 2600);
  </script>

  <!-- React + htm via CDN (classic scripts → globals, work from file://) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" crossorigin></script>

  <!-- App source (order matters: shared globals first) -->
  <script src="assets/data.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/graphics.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/storefront.js"></script>
  <script src="assets/admin.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
